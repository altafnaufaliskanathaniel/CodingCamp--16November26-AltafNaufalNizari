<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
      <span class="theme-icon">☀️</span> Light mode
    </button>
  </div>

  <!-- GREETING CARD -->
  <div class="greeting-card">
    <div class="greeting-top">
      <div class="greeting-text">
        <h1><span id="greeting-phrase">Hello</span>!</h1>
        <p id="greeting-sub">Here's your personal dashboard.</p>

        <!-- Custom name display -->
        <div class="greeting-name-row">
          <span id="name-display"></span>
          <button id="edit-name-btn">✏️ Edit</button>
        </div>

        <!-- Name edit form -->
        <form id="name-edit-form" onsubmit="return false;">
          <input id="name-input" type="text" maxlength="30" placeholder="Your name…" autocomplete="off" />
          <button id="save-name-btn" type="button">Save</button>
        </form>
      </div>

      <div class="datetime-display">
        <div id="current-time">00:00:00</div>
        <div id="current-date">Loading…</div>
      </div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- FOCUS TIMER -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title"><span>⏱</span> Focus Timer</h2>
      </div>

      <div class="timer-display">
        <div id="timer-time">25:00</div>
      </div>

      <div class="timer-progress-wrap">
        <div class="timer-progress-track">
          <div class="timer-progress-bar" id="timer-progress-bar"></div>
        </div>
        <p class="timer-label" id="timer-label">25 min session</p>
      </div>

      <div class="timer-controls">
        <button id="btn-start" class="btn-timer btn-start">▶ Start</button>
        <button id="btn-stop" class="btn-timer btn-stop">⏸ Pause</button>
        <button id="btn-reset" class="btn-timer btn-reset">↺ Reset</button>
      </div>

      <p id="timer-status" class="timer-status"></p>

      <!-- Change Pomodoro time -->
      <div class="timer-custom">
        <label for="custom-mins">Set time:</label>
        <input type="number" id="custom-mins" min="1" max="180" value="25" />
        <span>min</span>
        <button id="btn-set-time" class="btn-set-time">Apply</button>
      </div>
    </div>

    <!-- TO-DO LIST -->
    <div class="card todo-card">
      <div class="card-header">
        <h2 class="card-title"><span>✅</span> To-Do List</h2>
        <select id="sort-select" title="Sort tasks">
          <option value="default">Sort: Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="undone">Undone first</option>
          <option value="done">Done first</option>
        </select>
      </div>

      <div class="todo-add-row">
        <input id="new-task-input" type="text" placeholder="Add a new task…" maxlength="120" autocomplete="off" />
        <button id="btn-add-task" class="btn-add-task">+ Add</button>
      </div>
      <p id="duplicate-warning" class="duplicate-warning">⚠️ That task already exists!</p>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-footer" class="todo-footer"></p>
    </div>

    <!-- QUICK LINKS -->
    <div class="card" style="grid-column: span 2;">
      <div class="card-header">
        <h2 class="card-title"><span>🔗</span> Quick Links</h2>
      </div>

      <div id="links-grid" class="links-grid"></div>

      <div class="add-link-form">
        <input id="link-label" type="text" placeholder="Label (e.g. Gmail)" maxlength="30" />
        <input id="link-url"   type="url"  placeholder="URL (e.g. https://gmail.com)" />
        <button id="btn-add-link" class="btn-add-link">+ Add Link</button>
      </div>
    </div>

  </div><!-- /main-grid -->
</div><!-- /app-wrapper -->

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
